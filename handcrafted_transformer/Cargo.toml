[package]
name = "handcrafted_transformer"
version = "0.1.0"
edition = "2021"
description = "A GPT-style transformer built from scratch with Burn 0.21 (tracel-ai)"

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "generate"
path = "src/bin/generate.rs"

[dependencies]
burn = { version = "0.21", features = ["train", "ndarray", "autodiff"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# burn-train 0.21 internally uses rand 0.10; use the same major version
rand = "0.10"

[profile.dev]
opt-level = 1   # tensor ops are unusably slow at opt-level 0

[profile.release]
opt-level = 3
